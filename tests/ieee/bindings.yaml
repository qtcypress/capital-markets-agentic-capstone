# Execution bindings for Capital_Markets_GenAI_Agent_Test_Suite_IEEE.xlsx
#
# One entry per Test Case ID in the workbook. Regenerate with:
#     python tools/author_ieee_bindings.py
# Edit this file directly to change what a case sends or expects — the runner
# reads the YAML, not the generator.
#
# capability:
#   implemented  the system has this; a failure here is a defect to fix
#   partial      a reduced form exists; the case pins what is actually true
#   absent       no implementation exists; the failure is the finding
