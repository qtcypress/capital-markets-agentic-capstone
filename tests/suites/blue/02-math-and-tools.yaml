# ---------------------------------------------------------------------------
# BLUE TEAM — derivatives maths and tool contracts
# ---------------------------------------------------------------------------
# Forty positive cases in two halves:
#
#   BLUE-MATH-001..024   the pure functions in app/market/derivatives.py.
#                        Exact-value assertions are correct here because the
#                        module is deterministic. Covers Black-Scholes pricing,
#                        put-call parity, moneyness and edge cases, Greek sign
#                        and range invariants, the implied-vol round trip,
#                        strategy payoffs, margin arithmetic, PCR and max pain.
#
#   BLUE-TOOL-001..016   the tool registry in app/agents/tools.py. The happy
#                        path returns ok with the documented result SHAPE, the
#                        market-data tools always declare provenance, and bad
#                        arguments return the documented error codes.
#
# Conventions used throughout:
#   * black_scholes returns vega per 1 volatility point and theta per calendar
#     day; the Greek range assertions are scaled accordingly.
#   * t = 0.0821917808 years is 30 calendar days.
#   * No case asserts a live market level. Where a tool would otherwise fetch a
#     price, `spot` is supplied so the result is deterministic; the data tools
#     assert types, ranges and provenance only.
#   * The configured risk-free rate is 0.065; NIFTY has lot size 75 and a
#     50-point strike step. Both are asserted rather than assumed where used.
#   * `target: math` surfaces a raised exception as the Python exception class
#     name, hence `error_code: ValueError` on the invalid-input case.
#
# Run:
#   cd /home/claude/qtcap
#   python3 tools/run_suite.py blue --file tests/suites/blue/02-math-and-tools.yaml
# ---------------------------------------------------------------------------

# --- Black-Scholes pricing -------------------------------------------------

- id: BLUE-MATH-001
  title: ATM Black-Scholes call price and its intrinsic/time-value split
  category: pricing_math
  severity: high
  target: math
  tags: [black_scholes, call]
  input:
    function: black_scholes
    arguments: {spot: 25000, strike: 25000, t: 0.0821917808, r: 0.065, sigma: 0.14, option_type: call}
  checks:
    - {type: tool_ok}
    - {type: json_path_close_to, path: "result.price", value: 469.3465, tolerance: 0.05}
    - {type: json_path_equals, path: "result.intrinsic", value: 0}
    - {type: json_path_close_to, path: "result.time_value", value: 469.3465, tolerance: 0.05}

- id: BLUE-MATH-002
  title: ATM Black-Scholes put is cheaper than the matching call under positive carry
  category: pricing_math
  severity: high
  target: math
  tags: [black_scholes, put]
  input:
    function: black_scholes
    arguments: {spot: 25000, strike: 25000, t: 0.0821917808, r: 0.065, sigma: 0.14, option_type: put}
  checks:
    - {type: tool_ok}
    - {type: json_path_close_to, path: "result.price", value: 336.141, tolerance: 0.05}
    - {type: json_path_between, path: "result.price", min: 1, max: 469.3465}
    - {type: json_path_equals, path: "result.intrinsic", value: 0}

- id: BLUE-MATH-003
  title: Put-call parity holds — call minus put equals spot minus the discounted strike
  category: pricing_math
  severity: critical
  target: math
  tags: [parity, invariant]
  input:
    function: black_scholes
    arguments: {spot: 25000, strike: 25000, t: 0.0821917808, r: 0.065, sigma: 0.14, option_type: call}
  checks:
    - {type: tool_ok}
    # put 336.141 + (S - K*exp(-rT)) = 336.141 + 133.2055 = 469.3465
    - {type: json_path_close_to, path: "result.price", value: 469.3465, tolerance: 0.01}
    - {type: json_path_close_to, path: "result.d1", value: 0.153175, tolerance: 0.0001}
    - {type: json_path_close_to, path: "result.d2", value: 0.113038, tolerance: 0.0001}

- id: BLUE-MATH-004
  title: Deep ITM call approaches its intrinsic value and a delta near one
  category: pricing_math
  severity: high
  target: math
  tags: [moneyness, itm]
  input:
    function: black_scholes
    arguments: {spot: 26000, strike: 24000, t: 0.0821917808, r: 0.065, sigma: 0.14, option_type: call}
  checks:
    - {type: tool_ok}
    - {type: json_path_close_to, path: "result.price", value: 2133.8717, tolerance: 0.05}
    - {type: json_path_equals, path: "result.intrinsic", value: 2000}
    - {type: json_path_between, path: "result.delta", min: 0.95, max: 1.0}

- id: BLUE-MATH-005
  title: Deep OTM call is worth almost nothing and carries almost no delta
  category: pricing_math
  severity: high
  target: math
  tags: [moneyness, otm]
  input:
    function: black_scholes
    arguments: {spot: 25000, strike: 30000, t: 0.0821917808, r: 0.065, sigma: 0.14, option_type: call}
  checks:
    - {type: tool_ok}
    - {type: json_path_close_to, path: "result.price", value: 0.0012, tolerance: 0.01}
    - {type: json_path_between, path: "result.delta", min: 0.0, max: 0.01}
    - {type: json_path_equals, path: "result.intrinsic", value: 0}

- id: BLUE-MATH-006
  title: At zero time to expiry the option is worth exactly its intrinsic value
  category: pricing_math
  severity: high
  target: math
  tags: [edge_case, expiry]
  input:
    function: black_scholes
    arguments: {spot: 25000, strike: 24500, t: 0, r: 0.065, sigma: 0.14, option_type: call}
  checks:
    - {type: tool_ok}
    - {type: json_path_equals, path: "result.price", value: 500}
    - {type: json_path_equals, path: "result.time_value", value: 0}
    - {type: json_path_equals, path: "result.gamma", value: 0}
    - {type: json_path_equals, path: "result.vega", value: 0}

- id: BLUE-MATH-007
  title: At zero volatility the put collapses to intrinsic with delta minus one
  category: pricing_math
  severity: high
  target: math
  tags: [edge_case, zero_vol]
  input:
    function: black_scholes
    arguments: {spot: 25000, strike: 25500, t: 0.0821917808, r: 0.065, sigma: 0, option_type: put}
  checks:
    - {type: tool_ok}
    - {type: json_path_equals, path: "result.price", value: 500}
    - {type: json_path_equals, path: "result.delta", value: -1}
    - {type: json_path_equals, path: "result.theta", value: 0}

- id: BLUE-MATH-008
  title: Implied volatility round-trips — price at 14% vol, solve, get 14% back
  category: pricing_math
  severity: critical
  target: math
  tags: [implied_vol, round_trip]
  input:
    function: implied_volatility
    arguments: {market_price: 469.3465, spot: 25000, strike: 25000, t: 0.0821917808, r: 0.065, option_type: call}
  checks:
    - {type: tool_ok}
    - {type: json_path_equals, path: "result.converged", value: true}
    - {type: json_path_close_to, path: "result.implied_vol", value: 0.14, tolerance: 0.0005}
    - {type: json_path_close_to, path: "result.implied_vol_pct", value: 14.0, tolerance: 0.05}

# --- Greek invariants ------------------------------------------------------

- id: BLUE-MATH-009
  title: Long call Greeks obey their signs — delta 0..1, gamma and vega positive, theta negative
  category: greeks_math
  severity: critical
  target: math
  tags: [greeks, call, invariant]
  input:
    function: black_scholes
    arguments: {spot: 25000, strike: 25000, t: 0.0821917808, r: 0.065, sigma: 0.14, option_type: call}
  checks:
    - {type: tool_ok}
    - {type: json_path_between, path: "result.delta", min: 0.0, max: 1.0}
    - {type: json_path_between, path: "result.gamma", min: 0.0000001, max: 1.0}
    - {type: json_path_between, path: "result.vega", min: 0.01, max: 100000}
    - {type: json_path_between, path: "result.theta", min: -100000, max: -0.0001}
    - {type: json_path_between, path: "result.rho", min: 0.0001, max: 100000}

- id: BLUE-MATH-010
  title: Long put Greeks obey their signs — delta -1..0, gamma and vega positive, rho negative
  category: greeks_math
  severity: critical
  target: math
  tags: [greeks, put, invariant]
  input:
    function: black_scholes
    arguments: {spot: 25000, strike: 25000, t: 0.0821917808, r: 0.065, sigma: 0.14, option_type: put}
  checks:
    - {type: tool_ok}
    - {type: json_path_between, path: "result.delta", min: -1.0, max: 0.0}
    # gamma and vega are strike-symmetric: identical to the call in BLUE-MATH-009
    - {type: json_path_close_to, path: "result.gamma", value: 0.00039295, tolerance: 0.0000001}
    - {type: json_path_close_to, path: "result.vega", value: 28.259823, tolerance: 0.001}
    - {type: json_path_between, path: "result.theta", min: -100000, max: -0.0001}
    - {type: json_path_between, path: "result.rho", min: -100000, max: -0.0001}

