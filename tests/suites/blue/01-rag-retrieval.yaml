# ---------------------------------------------------------------------------
# BLUE TEAM — RAG retrieval, grounding, citations, scope, tuning and synonyms
# ---------------------------------------------------------------------------
# Forty positive ("does the good path actually work?") cases for the RAG
# application. They cover:
#
#   rag_retrieval  the right knowledge-base document is retrieved and cited
#                  for a given concept (options, Greeks, margin, settlement,
#                  taxation, corporate actions, microstructure, glossary,
#                  trading errors)
#   rag_grounding  answers stay above the lexical grounding threshold and do
#                  not invent material the corpus does not contain
#   rag_citations  every answer carries provenance, and it is the right doc
#   rag_scope      off-domain questions are refused, and questions the corpus
#                  cannot support are answered with an explicit
#                  "not in the knowledge base" rather than a guess
#   rag_tuning     top_k, min_score and category filtering behave as documented
#   rag_synonyms   F&O, OI, PCR, IV, ATM, CE/PE, MTM and STT still retrieve
#                  the right material (synonym expansion in the retriever)
#
# Notes for anyone editing this file:
#   * `target: kb` cases exercise raw retrieval only — no generation, no
#     guardrails — so they assert rank-1 documents, score floors and hit counts.
#   * The output guard appends the educational disclaimer to any answer that
#     mentions strategy, risk, margin, profit or loss, so `output_action` is
#     `sanitize` (not `allow`) on those cases. That is correct behaviour.
#   * Nothing here asserts on live market prices — only on corpus content,
#     retrieval structure and guard behaviour.
#
# Run:
#   cd /home/claude/qtcap
#   python3 tools/run_suite.py blue --file tests/suites/blue/01-rag-retrieval.yaml
# ---------------------------------------------------------------------------

# --- Retrieval correctness -------------------------------------------------

- id: BLUE-RAG-001
  title: Put-call parity retrieves the options fundamentals material
  category: rag_retrieval
  severity: high
  target: rag
  tags: [retrieval, options]
  input:
    query: "What is put-call parity and how does it link calls and puts?"
  checks:
    - {type: not_refused}
    - {type: cites_doc, any_of: [KB-03, KB-04, KB-05, KB-14]}
    - {type: retrieved_docs_include, any_of: [KB-03, KB-14]}
    - {type: grounding_min, value: 0.8}

