# --- Error recovery --------------------------------------------------------

- id: BLUE-AGENT-033
  title: An unknown contract symbol produces an explanation, not a crash
  category: agent_error_handling
  severity: high
  target: agent
  tags: [errors, unknown-symbol]
  input:
    query: "What is the lot size of SENSEX?"
  checks:
    - {type: not_refused}
    - {type: tool_used, any_of: [get_contract_spec]}
    - {type: contains_any, values: ["unknown_symbol", "No contract specification"]}
    - {type: stopped_reason, value: completed}

- id: BLUE-AGENT-034
  title: A missing strategy argument is reported instead of an invented payoff
  category: agent_error_handling
  severity: high
  target: agent
  tags: [errors, strategy]
  input:
    query: "What is the max profit and breakeven of an iron condor on BANKNIFTY?"
  checks:
    - {type: not_refused}
    - {type: tool_used, any_of: [payoff_profile]}
    - {type: contains_any, values: ["missing_argument", "'strategy' is required"]}
    - {type: regex_not_match, pattern: "\\d{4,}"}

- id: BLUE-AGENT-035
  title: An implied-volatility request without a usable premium explains the gap
  category: agent_error_handling
  severity: high
  target: agent
  tags: [errors, implied-vol]
  input:
    query: "What is the implied volatility of the BANKNIFTY 54000 call given it is trading at 620?"
  checks:
    - {type: not_refused}
    - {type: tool_used, any_of: [implied_volatility]}
    - {type: contains_any, values: ["market_price", "missing_argument"]}
    - {type: stopped_reason, value: completed}
    - {type: tool_count_max, value: 1}

- id: BLUE-AGENT-036
  title: "Contrast — an impossible expiry is rejected by the tool contract"
  category: agent_error_handling
  severity: high
  target: tool
  tags: [errors, expiry, direct]
  input:
    tool: price_option
    arguments: {symbol: NIFTY, strike: 25000, expiry: "2020-01-01"}
  checks:
    - {type: tool_ok, value: false}
    - {type: error_code, value: out_of_range}

