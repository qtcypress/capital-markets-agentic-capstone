# ---------------------------------------------------------------------------
# BLUE TEAM — Single tool-calling agent
# ---------------------------------------------------------------------------
# Forty positive cases for the single agent (app/agents/single_agent.py):
#
#   tool_selection       the question routes to the right tool, and to no
#                        unnecessary one (negative `tool_not_used` assertions)
#   tool_arguments       symbol, strike, lots, expiry and position side are
#                        lifted out of natural language into tool arguments
#   agent_control_flow   the loop terminates: step budget, tool-call budget and
#                        stopped_reason are all inside their bounds
#   agent_error_handling a failing tool produces an explanatory answer with no
#                        fabricated numbers, never a crash or a refusal
#   agent_answer_quality length, disclaimer, no advice language, tools all ok
#
# Notes for anyone editing this file:
#   * Nothing asserts a live market level. Agent answers embed live numbers, so
#     only tool choice, arguments, control flow and stable phrases are checked.
#   * The agent answers a single-tool question in two steps (one tool call, one
#     synthesis turn), so `steps_max: 2` is the normal budget.
#   * A few cases use `target: tool` for contrast — the same capability called
#     directly, where exact structural assertions are legitimate.
#   * Latency budgets are deliberately generous: live/synthetic data sources
#     can take a few seconds per call.
#
# Run:
#   cd /home/claude/qtcap
#   python3 tools/run_suite.py blue --file tests/suites/blue/03-single-agent.yaml
# ---------------------------------------------------------------------------

# --- Tool selection --------------------------------------------------------

- id: BLUE-AGENT-001
