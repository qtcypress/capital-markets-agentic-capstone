# --- Provenance integrity ---------------------------------------------------
# These cases catch the most dangerous data defect in a market application:
# generated or cached figures presented to the user as live market data.

- id: BLUE-DATA-017
  title: A quote payload's declared source agrees with the provider that produced it
  category: data_provenance
  severity: critical
  target: tool
  tags: [provenance, integrity]
  input:
    tool: get_quote
    arguments: {symbol: NIFTY}
