- id: BLUE-MCP-020
  title: Market-data results carry a provenance block naming source, provider and staleness
  category: mcp_protocol
  severity: high
  target: mcp
  tags: [protocol, provenance, market_data]
  input:
    tool: get_quote
    arguments: {symbol: RELIANCE}
  checks:
    - {type: tool_ok, value: true}
    - {type: json_path_equals, path: "server", value: market_data}
    - {type: json_path_exists, path: "result._provenance"}
    - {type: json_path_in, path: "result._provenance.source", any_of: [live, snapshot, synthetic]}
    - {type: json_path_type, path: "result._provenance.provider", value: string}
    - {type: json_path_type, path: "result._provenance.stale", value: boolean}
    - {type: json_path_equals, path: "result.lot_size", value: 500}

# ---------------------------------------------------------------------------
# Multi-agent — decomposition
# ---------------------------------------------------------------------------
- id: BLUE-MULTI-001
  title: A compound data-plus-risk question splits into 2+ subtasks across 2+ specialists
  category: multi_agent_decomposition
  severity: high
  target: multi
  tags: [decomposition, supervisor]
  input:
    query: "What is the option chain for NIFTY and also what is the margin for one lot of NIFTY futures?"
  checks:
    - {type: not_refused}
    - {type: subtask_count_min, value: 2}
    - {type: agent_count_min, value: 2}
    - {type: agent_used, any_of: [risk_analyst]}
    - {type: mcp_server_used, any_of: [market_data]}
    - {type: mcp_server_used, any_of: [risk]}
    - {type: latency_max_ms, value: 45000}

- id: BLUE-MULTI-002
