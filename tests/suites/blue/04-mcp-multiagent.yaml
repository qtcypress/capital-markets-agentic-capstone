    - {type: json_path_type, path: "result.strikes", value: array}
    - {type: json_path_length_min, path: "result.strikes", value: 3}
    - {type: json_path_type, path: "result.strikes[0].strike", value: number}
    - {type: json_path_equals, path: "result.window_applied", value: 3}

