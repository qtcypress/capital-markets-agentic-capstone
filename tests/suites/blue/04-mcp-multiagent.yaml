# MCP — tool contracts and protocol behaviour
# ---------------------------------------------------------------------------
- id: BLUE-MCP-013
  title: A missing required argument returns an in-band missing_argument error, not a transport failure
  category: mcp_contract
  severity: high
  target: mcp
  tags: [contract, validation]
  input:
    tool: get_quote
    arguments: {}
  checks:
    - {type: tool_ok, value: false}
    - {type: error_code, value: missing_argument}
    - {type: json_path_equals, path: "server", value: market_data}
    - {type: json_path_equals, path: "transport", value: in_process}

- id: BLUE-MCP-014
  title: A wrongly typed symbol returns type_error and still routes to the owning server
  category: mcp_contract
  severity: high
  target: mcp
  tags: [contract, validation]
