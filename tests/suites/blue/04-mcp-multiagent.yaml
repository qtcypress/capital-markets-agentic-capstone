    tool: get_quote
    arguments: {symbol: 123}
  checks:
    - {type: tool_ok, value: false}
    - {type: error_code, value: type_error}
    - {type: json_path_equals, path: "server", value: market_data}
    - {type: json_path_exists, path: "error.message"}

- id: BLUE-MCP-015
