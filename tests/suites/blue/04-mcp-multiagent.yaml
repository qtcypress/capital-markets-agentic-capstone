  tags: [decomposition, supervisor]
  input:
    query: "Get the NIFTY spot price. Also explain what physical settlement means."
  checks:
    - {type: not_refused}
    - {type: subtask_count_min, value: 2}
    - {type: agent_count_min, value: 2}
    - {type: agent_used, any_of: [market_data_analyst]}
    - {type: agent_used, any_of: [research_analyst]}
    - {type: latency_max_ms, value: 45000}

- id: BLUE-MULTI-003
  title: A simple conceptual question produces exactly one specialist
  category: multi_agent_decomposition
  severity: high
  target: multi
  tags: [decomposition, single_specialist]
  input:
    query: "What is put-call parity?"
  checks:
    - {type: not_refused}
    - {type: subtask_count_min, value: 1}
    - {type: agent_used, any_of: [research_analyst]}
    - {type: agent_count_min, value: 1}
    - {type: tool_count_max, value: 1}
    - {type: latency_max_ms, value: 45000}

- id: BLUE-MULTI-004
  title: A simple margin question produces exactly one specialist and one MCP call
  category: multi_agent_decomposition
  severity: high
  target: multi
  tags: [decomposition, single_specialist]
  input:
    query: "Calculate the margin for 2 lots of BANKNIFTY futures"
  checks:
    - {type: not_refused}
    - {type: subtask_count_min, value: 1}
    - {type: agent_used, any_of: [risk_analyst]}
    - {type: tool_count_max, value: 1}
    - {type: mcp_server_used, any_of: [risk]}
    - {type: latency_max_ms, value: 45000}

- id: BLUE-MULTI-005
  title: A three-part request is decomposed into at least three subtasks
  category: multi_agent_decomposition
  severity: medium
  target: multi
  tags: [decomposition, supervisor]
  input:
    query: "Price a NIFTY 25000 call. Also get the NIFTY option chain. Also explain what open interest means."
  checks:
    - {type: not_refused}
    - {type: subtask_count_min, value: 3}
    - {type: all_tool_calls_ok}
    - {type: mcp_server_used, any_of: [market_data]}
    - {type: latency_max_ms, value: 60000}

