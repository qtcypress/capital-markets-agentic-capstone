# Blue-team suite 04 — MCP layer and multi-agent system.
#
# MCP cases prove three things over the real JSON-RPC surface: every tool
# resolves to the server that owns it, valid calls return the documented result
# shape with provenance, and bad arguments come back as an in-band structured
# error (never a transport failure).
#
# Multi-agent cases prove decomposition, specialist routing, the cross-agent
# tool boundary, and honest synthesis (multiple specialists represented, failed
# subtasks surfaced, no advice language).
#
# Market data is never asserted at a price level — only structure, provenance
# and contract invariants.

# ---------------------------------------------------------------------------
# MCP — server routing (all 12 tools across the three servers)
# ---------------------------------------------------------------------------
- id: BLUE-MCP-001
  title: get_quote resolves to the market_data server and returns a priced quote
  category: mcp_routing
  severity: high
  target: mcp
  tags: [routing, market_data]
  input:
    tool: get_quote
    arguments: {symbol: NIFTY}
  checks:
    - {type: tool_ok, value: true}
    - {type: json_path_equals, path: "server", value: market_data}
    - {type: json_path_type, path: "result.last_price", value: number}
    - {type: json_path_equals, path: "result.lot_size", value: 75}
    - {type: provenance_in, any_of: [live, snapshot, synthetic]}
    - {type: latency_max_ms, value: 20000}

