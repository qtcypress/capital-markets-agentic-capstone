# Render blueprint — deploy this repo as a free web service.
#
# Render reads this file automatically when you create a Blueprint from the
# repository, so there is nothing to configure by hand.
#
#   Render dashboard -> New -> Blueprint -> pick this repo -> Apply
#
# Notes for whoever maintains this:
#  * plan: free spins the service down after inactivity and takes ~30s to wake.
#    For a classroom that is fine — the first student to open it wakes it.
#  * No API keys are set here on purpose. Students bring their own from the
#    browser, so the service holds no credentials.
services:
  - type: web
    name: capital-markets-agentic-capstone
    runtime: python
    plan: free
    region: singapore          # closest to Hyderabad; oregon/frankfurt also fine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    # Your own subdomain instead of <service>.onrender.com. The Hobby (free)
    # plan includes two custom domains, so this costs nothing. Uncomment and put
    # your hostname here, then create the DNS record Render shows you:
    #
    #   Type   Name       Value
    #   CNAME  capstone   capital-markets-agentic-capstone.onrender.com
    #
    # Render issues the TLS certificate itself once the record resolves. Set
    # QTCAP_CANONICAL_HOST below to the same hostname so the old .onrender.com
    # URL redirects to it rather than serving a second copy of the class.
    # domains:
    #   - capstone.qualitythought.in
    envVars:
      # Rate limits, request-body caps and strict error redaction — everything a
      # shared class URL needs and a laptop does not.
      - key: QTCAP_PUBLIC_MODE
        value: "1"
      - key: QTCAP_RATE_PER_MIN
        value: "40"
      - key: QTCAP_HEAVY_RATE_PER_MIN
        value: "8"
      # Live market APIs, falling back to snapshot then to labelled synthetic.
      - key: QTCAP_MARKET_MODE
        value: auto
      # One URL for the class. Set this to your custom domain once the DNS
      # record above resolves; every other hostname then 308s to it, so a bug
      # report and the screenshot attached to it agree on where they came from.
      # Leave it unset until the domain verifies, or the platform URL bounces
      # to a hostname that does not answer yet.
      # - key: QTCAP_CANONICAL_HOST
      #   value: capstone.qualitythought.in
      # Refuse hostnames nobody configured. Comma-separated; a leading dot
      # covers subdomains. Unset means answer to anything.
      # - key: QTCAP_ALLOWED_HOSTS
      #   value: capstone.qualitythought.in,capital-markets-agentic-capstone.onrender.com
      # The server's own default backend. Students override it per request with
      # their own free key, so this stays on the offline stub.
      - key: QTCAP_LLM_PROVIDER
        value: stub
      - key: PYTHON_VERSION
        value: "3.11.9"
