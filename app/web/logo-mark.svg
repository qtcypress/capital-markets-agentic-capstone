<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     width="128" height="128" role="img" aria-label="GenAItesting.online" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GenAItesting.online</title>
<defs>
    <linearGradient id="i-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC3705"/>
      <stop offset="0.55" stop-color="#F96F08"/>
      <stop offset="1" stop-color="#FE8D08"/>
    </linearGradient>
    <linearGradient id="i-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141560"/>
      <stop offset="1" stop-color="#090A4E"/>
    </linearGradient>
  </defs>
  
  <g class="mark">
    <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#i-badge)"/>
    <!-- antenna: the signal the model is listening on -->
    <path d="M64 34 V24" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="64" cy="18" r="7" fill="#FFFFFF"/>
    <!-- ears / probes -->
    <rect x="16" y="56" width="9" height="26" rx="4.5" fill="#FFFFFF"/>
    <rect x="103" y="56" width="9" height="26" rx="4.5" fill="#FFFFFF"/>
    <!-- head -->
    <rect x="28" y="32" width="72" height="66" rx="21" fill="#FFFFFF"/>
    <!-- eyes -->
    <circle cx="50" cy="51" r="6.5" fill="url(#i-ink)"/>
    <circle cx="78" cy="51" r="6.5" fill="url(#i-ink)"/>
    <!-- mouth: the pass mark -->
    <path d="M49 77 l8.5 8.5 l21 -21" stroke="url(#i-ink)" stroke-width="8.5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- neck, and shoulders the badge crops: the robot is bigger than the frame -->
    <path d="M64 98 v7" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="30" y="105" width="68" height="22" rx="15" fill="#FFFFFF"
          />
  </g>
</svg>
